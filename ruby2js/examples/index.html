<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Swill Ruby2JS semantic spike</title>
<main controller="Demo::Controller">
  <h1>Ruby2JS spike</h1>
  <label>Name <input bind="person.name"></label>
  <p bind="title"></p>
  <button data-action="clear">Clear person</button>
  <p>Controller awakening, binding, action, and teardown smoke test.</p>
</main>
<script src="../dist/swill.js"></script>
<script src="../dist/app.js"></script>
<script>
try {
  const {Runtime} = Swill;
  const root = document.querySelector("[controller]");
  const awakening = new (Runtime.resolve("Swill::Awakening"))();
  const [controller] = awakening.wire(document);
  controller.person.name = "Ada";
  const button = root.querySelector("[data-action]");
  button.addEventListener("click", () => {
    root.querySelector("input").disabled = true;
  }, {once: true});
  window.addEventListener("pagehide", () => {
    controller.teardown();
    controller.dispose();
  }, {once: true});
} catch (error) {
  document.body.dataset.swillError = error.stack || String(error);
  throw error;
}
</script>
</html>
