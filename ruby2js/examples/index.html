<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Swill Ruby2JS semantic spike</title>
<body application="Demo::Application">
<main controller="Demo::Controller">
  <h1>Ruby2JS spike</h1>
  <script type="application/json" outlet="seed">{"name": "Ada"}</script>
  <label>Name <input bind="person.name" outlet="name_field" bind-disabled="person.nil?"></label>
  <p bind="title"></p>
  <p>Badge count via object binding: <output bind="badge_count"></output></p>
  <button data-action="clear">Clear person</button>
  <section controller="Demo::PersonEditor" bind="person" bind-hidden="@represented_object.nil?">
    <label>Edit name <input bind="name"></label>
    <p>Blank: <output bind="name.blank?"></output></p>
    <button data-action="clear" bind-disabled="@represented_object.name.empty?">Clear via editor</button>
  </section>
  <section controller="Demo::Badge" outlet="badge">
    <p bind="title"></p>
    <button data-action="bump">Bump badge</button>
    <button data-action="clear">Reset badge</button>
    <button data-action="shout">Shout name</button>
    <button data-action="reset">Reset everything</button>
  </section>
  <section window="main" name="welcome"></section>
  <button data-action="swap_window">Swap window</button>
  <button data-action="open_palette">Open palette</button>
  <script type="application/json" outlet="roster">[
    {"id": "1", "name": "Ada", "job": "engineer"},
    {"id": "2", "name": "Grace", "job": "admiral"},
    {"id": "3", "name": "Linus", "job": "kernel"}
  ]</script>
  <section window="people">
    <section controller="Demo::PeopleList" outlet="people_list" bind="people" multiple>
      <table>
        <thead outlet="header_view"><tr>
          <th data-column="name" data-action="sort_by" bind-aria-sort="sort_states.name">Name</th>
          <th data-column="role" data-action="sort_by" bind-aria-sort="sort_states.role">Role</th>
          <th></th>
        </tr></thead>
        <tbody outlet="rows">
          <template for="row">
            <tr><td bind="name"></td><td bind="role"></td><td><button data-action="remove_person">Remove</button></td></tr>
          </template>
          <template for="editor">
            <tr controller="Swill::Controller::InlineEditor"><td><input bind="name"></td><td><input bind="role"></td><td>Enter saves, Escape cancels</td></tr>
          </template>
        </tbody>
      </table>
      <p>Selected: <output bind="@selected_object.name"></output></p>
      <button data-action="activate_selection" bind-disabled="@selected_indexes.empty?">Edit selected</button>
    </section>
  </section>
  <p>Application launch, nested controller ownership, binding, action, and teardown smoke test.</p>
</main>
<template for="window" name="welcome">
  <article controller="Demo::Badge"><p bind="title"></p><p class="note">Welcome</p></article>
</template>
<template for="window" name="farewell">
  <article controller="Demo::Badge"><p bind="title"></p><p class="note">Farewell</p></article>
</template>
<template for="window" name="palette">
  <dialog controller="Demo::Badge"><p bind="title"></p><button data-action="close">Close</button></dialog>
</template>
<script src="../dist/swill.js"></script>
<script src="../dist/app.js"></script>
</body>
</html>
