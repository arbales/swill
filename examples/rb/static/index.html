<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swill, in Ruby2JS</title>
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="./static.css" />
  </head>
  <body application="Static::Application">
    <section window="toolbar">
      <header controller="Static::Menubar" class="toolbar example-toolbar">
        <h2>Swill, in Ruby2JS</h2>
        <div class="segmented-control" role="group" aria-label="Examples">
          <button type="button" data-action="show_example" data-example="bindings" aria-pressed="false">Bindings</button>
          <button type="button" data-action="show_example" data-example="controls" aria-pressed="false">Controls</button>
          <button type="button" data-action="show_example" data-example="data" aria-pressed="false">Data</button>
        </div>
        <div class="window-actions">
          <button type="button" data-action="show_palette">Palette</button>
          <button type="button" data-action="show_intro">Intro Pane</button>
          <button type="button" data-action="show_details">Details Pane</button>
        </div>
      </header>
    </section>

    <section window="main" name="bindings"></section>

    <template for="window" name="bindings">
      <section controller="Static::BindingsPane" class="example-pane">
        <p><strong>Notification center:</strong> <span bind="last_notification"></span></p>
        <aside class="first-responder-debug" aria-live="polite">
          <strong>First responder:</strong>
          <output bind="first_responder_debug"></output>
        </aside>

        <h1 bind="greeting"></h1>
        <fieldset class="control-group control-group--framed">
          <legend>User</legend>
          <label>
            Name
            <input type="text" bind="user.name" outlet="name_field" />
          </label>
          <label>
            Email
            <input type="email" bind="user.email" bind-readonly="@saving" />
          </label>
          <p bind="summary"></p>
          <p bind-hidden="user.present_email?">Email is missing.</p>
          <label>
            Derived read-only email
            <input type="email" readonly bind="user.email.strip.upcase" />
          </label>
          <p>Email blank: <output bind="user.email.blank?"></output></p>
          <label>
            Saving
            <input type="checkbox" bind="saving" />
          </label>
          <div class="actions">
            <button type="button" data-action="fake_save" bind-disabled="user.blank_email?">Save</button>
            <button type="button" data-action="clear" bind-disabled="user.name.strip.empty?">Clear</button>
          </div>
        </fieldset>

        <section>
          <h2>Model editing draft</h2>
          <p>Canonical model dirty: <output bind="user.dirty?"></output></p>
          <section controller="Static::DraftEditor" outlet="draft_editor">
            <p>Enter applies this editor; Escape resets it.</p>
            <label>Draft name <input type="text" bind="name" /></label>
            <label>Draft email <input type="email" bind="email" /></label>
            <p>Draft dirty: <output bind="dirty?"></output></p>
            <div class="actions">
              <button type="button" data-action="apply_draft" bind-disabled="clean?">Apply Draft</button>
              <button type="button" data-action="reset_draft" bind-disabled="clean?">Reset Draft</button>
            </div>
          </section>
        </section>

        <section controller="Static::Card">
          <h2 bind="name"></h2>
          <label>Represented name <input type="text" bind="name" /></label>
          <label>Controller-local note <input type="text" bind="@note" placeholder="local note" /></label>
          <button type="button" bind-disabled="@note_blank?">Note action</button>
        </section>

        <section controller="Static::Counter">
          <h2>Nested counter</h2>
          <p bind="count"></p>
          <button type="button" data-action="increment">Increment</button>
        </section>
      </section>
    </template>

    <template for="window" name="controls">
      <section controller="Static::ControlsPane" class="example-pane">
        <h2>Controls</h2>

        <section>
          <h2>Text field control</h2>
          <input type="text" klass="Swill::Control::TextField" outlet="standalone_text_field" value="Observable control" />
          <p>Control value: <output bind="standalone_text_field.value"></output></p>
        </section>

        <section>
          <h2>Select control</h2>
          <select klass="Swill::Control::Select" outlet="standalone_select">
            <option value="">Choose a person</option>
          </select>
          <p>Selected value: <output bind="standalone_select.value"></output></p>
        </section>

        <section>
          <h2>Segmented control</h2>
          <div klass="Swill::Control::Segmented" outlet="segmented" bind="selected_person" aria-label="Person"></div>
        </section>

        <section>
          <h2>Custom select control</h2>
          <div klass="Swill::Control::CustomSelect" outlet="custom_select" bind="selected_person"></div>
          <p>Selected value: <output bind="selected_person"></output></p>
        </section>
      </section>
    </template>

    <template for="window" name="data">
      <section controller="Static::DataPane" class="example-pane">
        <h2>Data</h2>

        <section>
          <h2>Template-backed list</h2>
          <p>Click a row to select it; shift-click selects a range. Double-click or press Enter to edit it.</p>
          <div class="table-scroll">
            <table class="people-table" controller="Swill::Controller::EditableList" outlet="people_list" tabindex="0" multiple>
              <thead outlet="header_view">
                <tr>
                  <th data-column="name" data-action="sort_by" bind-aria-sort="sort_states.name">Name</th>
                  <th data-column="role" data-action="sort_by" bind-aria-sort="sort_states.role">Role</th>
                </tr>
              </thead>
              <tbody outlet="rows">
                <template for="row">
                  <tr>
                    <td bind="name"></td>
                    <td bind="role"></td>
                  </tr>
                </template>
                <template for="editor">
                  <tr controller="Swill::Controller::InlineEditor">
                    <td><input type="text" klass="Swill::Control::TextField" bind="name" aria-label="Name" /></td>
                    <td><input type="text" klass="Swill::Control::TextField" bind="role" aria-label="Role" /></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <p>Selected: <output bind="selected_people"></output></p>
          <p>Activated: <output bind="activated_person"></output></p>
        </section>
      </section>
    </template>

    <section window="workspace" name="intro-pane" class="workspace-window"></section>

    <template for="window" name="palette">
      <dialog controller="Static::Palette" class="window palette-window">
        <h2>Palette</h2>
        <input type="text" outlet="field" placeholder="Focus lands here" />
        <div class="actions"><button type="button" data-action="close">Close</button></div>
      </dialog>
    </template>

    <template for="window" name="intro-pane">
      <section controller="Static::IntroPane" class="workspace-pane">
        <h2>Intro</h2>
        <p>Window content and these fields are restored from the URL fragment.</p>
        <label>Query <input type="text" outlet="field" bind="query" /></label>
        <label>Page <input type="number" bind="page" /></label>
        <p>Restored page: <output bind="page"></output></p>
      </section>
    </template>

    <template for="window" name="details-pane">
      <section controller="Static::DetailsPane" class="workspace-pane">
        <h2>Details</h2>
        <label>Query <input type="text" outlet="field" bind="query" /></label>
      </section>
    </template>

    <script src="../../../rb/dist/swill.js"></script>
    <script src="../../../rb/dist/app.js"></script>
  </body>
</html>
