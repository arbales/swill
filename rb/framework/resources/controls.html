<template name="custom_select">
  <button type="button" class="custom-select-button" tabindex="-1" outlet="button" data-action="button_clicked">
    <span class="custom-select-trigger-icon" aria-hidden="true" outlet="icon"></span>
    <span class="custom-select-label" outlet="label"></span>
  </button>
  <div class="custom-select-popup" role="listbox" outlet="popup"></div>
  <template outlet="option_template">
    <button type="button" class="custom-select-option" role="option" tabindex="-1">
      <span class="custom-select-icon" aria-hidden="true"></span>
      <span class="custom-select-option-text">
        <span class="custom-select-option-label"></span>
        <span class="custom-select-option-description"></span>
      </span>
    </button>
  </template>
</template>

<template name="segmented">
  <div class="segmented-options" outlet="segments"></div>
  <template outlet="segment_template">
    <button type="button" class="segmented-option" role="radio" tabindex="-1"></button>
  </template>
</template>
